<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rahayel Admin</title>
<style>
body{margin:0;background:#080808;color:#f7f7f7;font-family:Arial,Tahoma,sans-serif}.w{width:min(1100px,calc(100% - 24px));margin:auto}header{padding:18px 0;border-bottom:1px solid #292929}b,h2{color:#ff6a00}.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.tabs button,.dark{background:#202124;color:#fff}.tabs button.on,.orange{background:#ff6a00;color:#111}.page{display:none}.page.on{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#121315;border:1px solid #292a2d;border-radius:16px;padding:16px}.num{font-size:28px;font-weight:bold;color:#ff6a00}.table{overflow:auto;border-radius:14px;border:1px solid #292a2d}table{width:100%;border-collapse:collapse;min-width:700px;background:#111}th,td{padding:12px;border-bottom:1px solid #292a2d;text-align:right}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0d0e10;color:white}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:grid;grid-template-columns:2fr .6fr auto;gap:8px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.invoice{display:none;background:#fff;color:#111;padding:25px;max-width:760px;margin:20px auto}.invoice table{background:white;min-width:0}.invoice th,.invoice td{color:#111;border-color:#ddd}.warn{color:#ffb36e}.ok{color:#7de6a3}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}@media print{body>*:not(#invoice){display:none!important}#invoice{display:block!important}}
</style></head><body><header><div class="w"><b>RAHAYEL</b> — إدارة المخزون والفواتير</div></header><div class="w">
<div class="tabs"><button class="on" data-p="dash">الرئيسية</button><button data-p="stock">المخزون</button><button data-p="sale">فاتورة جديدة</button><button data-p="history">الفواتير والعملاء</button></div>
<section id="dash" class="page on"><div class="cards"><div class="card"><div id="s1" class="num">0</div>قطع بالمخزون</div><div class="card"><div id="s2" class="num">0</div>فواتير</div><div class="card"><div id="s3" class="num">0</div>مبيعات بالدرهم</div><div class="card"><div id="s4" class="num">0</div>تنبيهات مخزون</div></div><div class="card" style="margin-top:15px"><h3>تنبيهات</h3><div id="alerts"></div></div></section>
<section id="stock" class="page"><div class="actions"><button class="btn orange" onclick="addP()">+ إضافة منتج</button></div><div class="table"><table><thead><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>حد التنبيه</th><th>الحالة</th><th></th></tr></thead><tbody id="stockBody"></tbody></table></div></section>
<section id="sale" class="page"><div class="card"><h2>فاتورة جديدة</h2><div class="form"><label>اسم العميل<input id="cn"></label><label>رقم الهاتف<input id="cp"></label><label>الاستلام<select id="dm"><option>استلام</option><option>توصيل</option></select></label><label>رسوم التوصيل<input id="df" type="number" value="0" min="0"></label><label>حالة الدفع<select id="pay"><option>غير مدفوع</option><option>مدفوع</option></select></label><label>ملاحظات<input id="note"></label></div><h3>المنتجات</h3><div id="items"></div><button class="btn dark" onclick="addRow()">+ إضافة منتج</button><h2>الإجمالي: <span id="total">0</span> درهم</h2><button class="btn orange" onclick="saveOrder()">حفظ وإصدار الفاتورة</button></div></section>
<section id="history" class="page"><input id="search" placeholder="بحث بالاسم أو الهاتف أو رقم الفاتورة" oninput="renderOrders()" style="max-width:420px;margin-bottom:12px"><div class="table"><table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الدفع</th><th></th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
</div><div id="invoice" class="invoice"></div>
<script>
let P=JSON.parse(localStorage.getItem("rP")||"null")||[{id:"m",name:"قاعدة رحايل للهاتف",price:220,qty:0,min:3},{id:"p",name:"إطار لوحة الدراجة النارية",price:45,qty:0,min:3},{id:"h",name:"حامل الخوذة ومعدات رحايل",price:55,qty:0,min:3},{id:"c",name:"منظّم سلك الشحن",price:30,qty:0,min:3}],O=JSON.parse(localStorage.getItem("rO")||"[]");
const E=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
function persist(){localStorage.setItem("rP",JSON.stringify(P));localStorage.setItem("rO",JSON.stringify(O));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button,.page").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.p).classList.add("on")});
function render(){stockBody.innerHTML=P.map((p,i)=>`<tr><td>${E(p.name)}</td><td>${p.price}</td><td><b>${p.qty}</b></td><td>${p.min}</td><td class="${p.qty<=p.min?'warn':'ok'}">${p.qty===0?'نفد':p.qty<=p.min?'منخفض':'متوفر'}</td><td><button class="btn dark" onclick="editP(${i})">تعديل</button></td></tr>`).join("");s1.textContent=P.reduce((a,p)=>a+ +p.qty,0);s2.textContent=O.length;s3.textContent=O.reduce((a,o)=>a+ +o.total,0);let low=P.filter(p=>p.qty<=p.min);s4.textContent=low.length;alerts.innerHTML=low.length?low.map(p=>`⚠️ ${E(p.name)} — المتبقي ${p.qty}<br>`).join(""):'<span class="ok">لا توجد تنبيهات.</span>';renderOrders();refreshRows()}
function addP(){let name=prompt("اسم المنتج");if(!name)return;P.push({id:String(Date.now()),name,price:+prompt("السعر","0"),qty:+prompt("الكمية","0"),min:+prompt("حد التنبيه","3")});persist()}
function editP(i){let p=P[i],name=prompt("الاسم",p.name);if(name===null)return;p.name=name;p.price=+prompt("السعر",p.price);p.qty=+prompt("الكمية",p.qty);p.min=+prompt("حد التنبيه",p.min);persist()}
function opts(v=""){return P.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${E(p.name)} — ${p.price} درهم (متوفر ${p.qty})</option>`).join("")}
function addRow(){let d=document.createElement("div");d.className="row";d.innerHTML=`<select class="prod" onchange="calc()">${opts()}</select><input class="qty" type="number" value="1" min="1" oninput="calc()"><button class="btn dark" onclick="this.parentElement.remove();calc()">×</button>`;items.appendChild(d);calc()}
function refreshRows(){document.querySelectorAll(".prod").forEach(s=>{let v=s.value;s.innerHTML=opts(v)});calc()}
function chosen(){return [...document.querySelectorAll(".row")].map(r=>{let p=P.find(x=>x.id===r.querySelector(".prod").value),q=+r.querySelector(".qty").value;return p?{id:p.id,name:p.name,price:p.price,qty:q,sub:p.price*q}:null}).filter(Boolean)}
function calc(){total.textContent=chosen().reduce((a,x)=>a+x.sub,0)+ +(df.value||0)}df.oninput=calc;
function saveOrder(){let its=chosen();if(!its.length)return alert("أضف منتجًا");for(let x of its){let p=P.find(y=>y.id===x.id);if(x.qty>p.qty)return alert("الكمية غير كافية من "+p.name)}its.forEach(x=>P.find(y=>y.id===x.id).qty-=x.qty);let n=O.length?Math.max(...O.map(o=>+o.no.replace(/\D/g,"")))+1:1,sub=its.reduce((a,x)=>a+x.sub,0),fee=+(df.value||0),o={no:"RAH-"+String(n).padStart(4,"0"),date:new Date().toLocaleString("ar-AE"),name:cn.value,phone:cp.value,delivery:dm.value,fee,pay:pay.value,note:note.value,items:its,total:sub+fee};O.unshift(o);persist();show(o)}
function renderOrders(){let q=(search?.value||"").toLowerCase();ordersBody.innerHTML=O.filter(o=>(o.no+" "+o.name+" "+o.phone).toLowerCase().includes(q)).map(o=>`<tr><td>${o.no}</td><td>${o.date}</td><td>${E(o.name||"-")}</td><td>${E(o.phone||"-")}</td><td>${o.total}</td><td>${o.pay}</td><td><button class="btn dark" onclick="showNo('${o.no}')">فاتورة</button></td></tr>`).join("")}
function showNo(n){show(O.find(o=>o.no===n))}
function show(o){invoice.innerHTML=`<h2>RAHAYEL — رحايل</h2><h3>فاتورة ${o.no}</h3><p>${o.date}</p><p><b>العميل:</b> ${E(o.name||"-")} | <b>الهاتف:</b> ${E(o.phone||"-")}</p><table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${o.items.map(x=>`<tr><td>${E(x.name)}</td><td>${x.qty}</td><td>${x.price}</td><td>${x.sub}</td></tr>`).join("")}</table><p>طريقة الاستلام: ${o.delivery}${o.fee?' — رسوم '+o.fee+' درهم':''}</p><p>حالة الدفع: ${o.pay}</p><h2>الإجمالي: ${o.total} درهم</h2><button class="btn orange" onclick="print()">طباعة / PDF</button> <button class="btn dark" onclick="invoice.style.display='none'">إغلاق</button>`;invoice.style.display="block";invoice.scrollIntoView()}
addRow();render();
</script></body></html>
